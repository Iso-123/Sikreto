<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Glowing Profile</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="background-glow"></div>

    <div class="profile-card">

        <!-- Profile Picture -->
        <div class="avatar-container">
            <img src="profile.jpg" alt="Profile Picture" class="avatar">
        </div>

        <!-- Username -->
        <h1 class="username">Httpslex ♡</h1>

        <!-- Bio -->
        <p class="bio">Welcome to my profile ♡</p>

        <!-- Location -->
        <p class="location">
            <i class="fas fa-map-marker-alt"></i>
            Sa puso ni Alexa
        </p>

        <!-- Social Media -->
        <div class="social-icons">

             <a href="https://discord.gg/9qQvYNDc3"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Discord Server">
        <i class="fab fa-discord"></i>
        </a>

            <a href="https://www.roblox.com/users/10639692989/profile" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-gamepad"></i>
            </a>

            <a href="https://www.instagram.com/httpsisooo.i/" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://www.tiktok.com/@httpsiisooo" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-tiktok"></i>
            </a>

        </div>

        

<!-- Custom Music Player -->
<div class="music-player">

    <div class="music-cover">
        <img src="cover.jpg" alt="Album Cover" id="albumCover">
    </div>

    <div class="music-details">
        <h3 id="songTitle">My Favorite Song</h3>
        <p id="songArtist">Unknown Artist</p>

        <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range"
                   id="volumeSlider"
                   min="0"
                   max="100"
                   value="50"
                   aria-label="Music volume">
        </div>
    </div>

    <button id="musicButton" type="button"
            aria-label="Play music">
        <i class="fas fa-play"></i>
    </button>

    <!-- Music Progress -->
    <div class="music-progress">
        <input type="range"
               id="progressBar"
               min="0"
               max="100"
               value="0"
               aria-label="Song progress">

        <div class="music-time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

</div>

<audio id="backgroundMusic" loop preload="metadata">
    <source src="music.mp3" type="audio/mpeg">
</audio>

    </div>

    <script src="script.js"></script>

</body>
</html>
